services:
  - type: web
    name: paytm-wallet-r2
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytm-wallet-r2-db
          property: connectionString
      - key: LOG_LEVEL
        value: info

databases:
  - name: paytm-wallet-r2-db
    plan: free
    region: singapore
    databaseName: wallet
    user: wallet
